services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${PREFIX_CONTENEDOR}_app:latest
    container_name: ${PREFIX_CONTENEDOR}_app
    ports:
      - "${PUERTO_WEB:-8080}:80"
    environment:
      DB_HOST: db
      DB_DATABASE: ${DB_DATABASE:-comanda-php}
      DB_USERNAME: ${DB_USERNAME:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - red_interna
    volumes:
      - ./:/var/www/html
 
  db:
    image: mysql:8.0
    container_name: ${PREFIX_CONTENEDOR}_db
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
      MYSQL_DATABASE: ${DB_DATABASE:-comanda-php}
      MYSQL_USER: ${DB_USERNAME:-}
      MYSQL_PASSWORD: ${DB_PASSWORD:-}
    ports:
      - "127.0.0.1:${PUERTO_DB:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - red_interna
 
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ${PREFIX_CONTENEDOR}_pma
    environment:
      PMA_HOST: db
      MYSQL_ROOT_PASSWORD: ""
    ports:
      - "${PUERTO_PMA:-8081}:80"
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - red_interna
 
networks:
  red_interna:
    name: ${PREFIX_CONTENEDOR}_red
    driver: bridge
 
volumes:
  db_data:
    name: ${PREFIX_CONTENEDOR}_db_data
    driver: local
